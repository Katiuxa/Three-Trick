    <rect x="602" y="452" width="132" height="120" rx="20" fill="url(#tile)"/>
    <text x="356" y="536" text-anchor="middle" font-family="Rubik, Inter, sans-serif" font-size="84" font-weight="800" fill="#1a140e">1</text>
    <text x="512" y="536" text-anchor="middle" font-family="Rubik, Inter, sans-serif" font-size="84" font-weight="800" fill="#1a140e">2</text>
    <text x="668" y="536" text-anchor="middle" font-family="Rubik, Inter, sans-serif" font-size="84" font-weight="800" fill="#1a140e">3</text>
