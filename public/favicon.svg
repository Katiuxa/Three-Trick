<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="felt" cx="50%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#1d3a28"/>
      <stop offset="55%" stop-color="#0e1a12"/>
      <stop offset="100%" stop-color="#07110b"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3e0a6"/>
      <stop offset="45%" stop-color="#e0c36a"/>
      <stop offset="100%" stop-color="#a8842a"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a3a24"/>
      <stop offset="100%" stop-color="#2a1810"/>
